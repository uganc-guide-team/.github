name: Bug
description: Signaler un comportement incorrect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Merci de décrire le problème le plus précisément possible, pour que n'importe quel membre puisse le reproduire.
  - type: textarea
    id: probleme
    attributes:
      label: Que se passe-t-il ?
      description: Ce que vous observez.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Qu'est-ce qui devrait se passer ?
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir la page…
        2. Cliquer sur…
        3. Constater que…
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Appareil et navigateur
      placeholder: "Ex. : Android 13, Chrome 130"
  - type: textarea
    id: captures
    attributes:
      label: Captures d'écran ou messages d'erreur
